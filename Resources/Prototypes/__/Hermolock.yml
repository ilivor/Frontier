- type: entity
  id: HermeticSeal
  parent: BaseAirlock
  name: hermetic seal
  description: Absolute security door. Only opens with digital code.
  components:
  - type: HermeticSealDoor
    codeLength: 6
    invulnerable: true
  - type: Door
    clickOpen: false
    bumpOpen: false
    canPry: false
  - type: Airlock
    autoClose: false
    emergencyAccess: false
  - type: ActivatableUI
    key: HermeticSealUI
    singleUser: false
  - type: Sprite
    sprite: Objects/Doors/hermetic.rsi
    layers:
    - state: closed
      map: ["hermetic_closed"]
    - state: open
      map: ["hermetic_open"]
  - type: Appearance